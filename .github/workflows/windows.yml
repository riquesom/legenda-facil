name: Instalador do Windows

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  construir:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyinstaller pythonnet huggingface_hub

      - name: Baixar o modelo de voz
        run: python baixar_modelo.py

      - name: Empacotar o programa
        run: pyinstaller --noconfirm --clean LegendaFacil.spec

      - name: Baixar o componente WebView2
        run: curl.exe -L -o webview2.exe "https://go.microsoft.com/fwlink/p/?LinkId=2124703"

      - name: Instalar o Inno Setup
        run: choco install innosetup --no-progress -y

      - name: Montar o instalador
        run: '& "C:\Program Files (x86)\Inno Setup 6\ISCC.exe" instalador.iss'

      - uses: actions/upload-artifact@v4
        with:
          name: LegendaFacil-Windows-Instalador
          path: Output/*.exe
          retention-days: 30
